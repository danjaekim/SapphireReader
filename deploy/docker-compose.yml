# Sapphire — Phase 0 engine stack
#
# Runs the pieces Sapphire's own server will sit on top of:
#   sapphire      the Sapphire app itself (web UI + server), opens at http://<NAS IP>:8080
#   engine        Suwayomi-Server, used only as a headless runtime for Keiyoushi extensions
#   flaresolverr  Cloudflare challenge solver the engine calls when a site blocks it
#   ntfy          self-hosted push notifications for new chapters
#   watchtower    updates the sapphire app when a new build is published (Status page: Update now)
#
# Phase 0 only: the engine's web UI and port 4567 are exposed so you can install
# extensions and test your sites by hand. From Phase 1 on, Sapphire's server talks to
# the engine over the internal network and port 4567 is removed (see the PHASE 1 notes).
#
# Before starting: replace every CHANGE_ME value below (the engine password appears twice).
# Setup guide: docs/phase-0-setup.md

name: sapphire

services:
  engine:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: sapphire-engine
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      # Keiyoushi extension repository (Mihon/Tachiyomi extensions).
      - EXTENSION_STORES=["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.pb"]
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # Login for the Phase 0 web UI. PHASE 1: Sapphire's server uses these too.
      - AUTH_MODE=basic_auth
      - AUTH_USERNAME=sapphire
      - AUTH_PASSWORD=CHANGE_ME
      # Cap the Java heap so the engine can't grow past ~768 MB of heap.
      - JAVA_TOOL_OPTIONS=-Xmx768m
      # The engine's own library updates are not used; Sapphire runs its own checks.
      - UPDATE_INTERVAL=0
    volumes:
      - ./data/engine:/home/suwayomi/.local/share/Tachidesk
    ports:
      # PHASE 0 ONLY. Remove this in Phase 1 and set WEB_UI_ENABLED=false.
      - "4567:4567"
    networks:
      - sapphire

  sapphire:
    # Built by GitHub Actions on every push to main. If the package is private,
    # run `sudo docker login ghcr.io` on the NAS once with a token that has read:packages.
    image: ghcr.io/danjaekim/sapphire:latest
    container_name: sapphire-app
    restart: unless-stopped
    labels:
      # Watchtower only touches containers with this label.
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - engine
    environment:
      - TZ=America/New_York
      - ENGINE_URL=http://engine:4567
      - ENGINE_USER=sapphire
      # Same password as the engine's AUTH_PASSWORD above.
      - ENGINE_PASSWORD=CHANGE_ME
      # New-chapter alerts. Sapphire checks your library every 6 hours and posts to ntfy
      # when a series you're caught up on gets a new chapter.
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=sapphire
      - NTFY_USER=dan
      # The password you chose for your ntfy login (phase-0-setup.md, step 5).
      - NTFY_PASSWORD=CHANGE_ME
      # Tapping an alert opens this address, so use the one your phone reaches Sapphire at.
      - PUBLIC_URL=http://CHANGE_ME_NAS_IP:8080
      # Lets the Status page's "Update now" button ask Watchtower (below) to update Sapphire.
      - UPDATE_URL=http://watchtower:8080
      # Any long random string; must match WATCHTOWER_HTTP_API_TOKEN below.
      - UPDATE_TOKEN=CHANGE_ME_UPDATE_TOKEN
    volumes:
      # Library and reading progress live here. Back up this folder.
      - ./data/app:/data
    ports:
      - "8080:8080"
    networks:
      - sapphire

  flaresolverr:
    # Byparr is a FlareSolverr-compatible solver; it is what Suwayomi's own
    # compose template ships with. Not exposed outside the stack.
    image: ghcr.io/thephaseless/byparr:latest
    container_name: sapphire-flaresolverr
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - sapphire

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: sapphire-ntfy
    restart: unless-stopped
    command: serve
    environment:
      - TZ=America/New_York
      # The address your phone uses to reach ntfy, e.g. http://192.168.1.50:8090
      - NTFY_BASE_URL=http://CHANGE_ME_NAS_IP:8090
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      # Nobody can read or post without logging in.
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # Needed for instant delivery on iPhone. Only a message id is relayed, never the text.
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "8090:80"
    networks:
      - sapphire

  watchtower:
    # Pulls new Sapphire builds and restarts the app. Only the Sapphire app is updated (label above).
    # This is a maintained fork of containrrr/watchtower, which no longer works with current Docker.
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: sapphire-watchtower
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=CHANGE_ME_UPDATE_TOKEN
      # Also checks by itself every 6 hours.
      - WATCHTOWER_POLL_INTERVAL=21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only if the Sapphire image on GHCR is private: lets Watchtower use the login you made with
      # `sudo docker login ghcr.io` on the NAS. Uncomment it (making the package public also works).
      # - /root/.docker/config.json:/config.json:ro
    networks:
      - sapphire

networks:
  sapphire:
    name: sapphire
