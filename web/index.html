<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sapphire</title>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Sapphire"><img src="/icon.svg" alt="" width="64" height="64" /></div></div>
    <style>
      .boot { min-height: 100dvh; display: grid; place-items: center; background: #0b1220; }
      .boot img { animation: bootPulse 1.2s ease-in-out infinite; }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
